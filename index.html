<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>杨芷琳 | AI 体验设计师作品集</title>
    <style>
      /* 纯 HTML 瞬时预加载器 —— JS bundle 还在下载时立刻显示，消除白屏 */
      #html-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0c0c0e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        transition: opacity 0.4s ease;
      }
      #html-preloader .brand {
        color: #d2ff55;
        font-size: 12px;
        letter-spacing: 0.25em;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      #html-preloader .bar-track {
        width: min(280px, 60vw);
        height: 4px;
        background: #1a1a1c;
        border-radius: 2px;
        overflow: hidden;
      }
      #html-preloader .bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #d2ff55, #ff55bb, #5d59f7);
        border-radius: 2px;
        animation: html-load 3s ease-out forwards;
      }
      @keyframes html-load {
        0% { width: 0%; }
        30% { width: 25%; }
        60% { width: 55%; }
        85% { width: 80%; }
        100% { width: 92%; }
      }
      #html-preloader .sub {
        color: #555;
        font-size: 10px;
        letter-spacing: 0.2em;
        margin-top: 16px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body style="overflow-y: scroll">
    <div id="html-preloader">
      <div class="brand">YANG ZHILIN</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="sub">LOADING</div>
    </div>
    <div id="root"></div>
    <!-- 静音音频预热器：绕过浏览器自动播放限制，让 AudioContext 更快激活 -->
    <audio id="audio-warmup" autoplay muted loop playsinline
           src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=">
    </audio>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
